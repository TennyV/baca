# The bacówka — Baca's config.
#
# juhasi: the shepherd's assistants (the council of models) sent out on each redyk.
# gazda:  the homestead manager who presses their work into the final oscypek.
#
# Cloud API keys come from the environment:
#   OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY, XAI_API_KEY
# Flip enabled: false for any juhas whose key you haven't added yet.
# Add a local model any time by pointing at ollama/<name> with no key needed.

system: "You are a sharp, concise expert. Be accurate and specific; do not pad."

juhasi:
  - name: GPT
    model: openai/gpt-5.1
    enabled: true          # needs OPENAI_API_KEY
    temperature: 0.7
    fallbacks:
      - openai/gpt-4.1

  - name: Claude
    model: anthropic/claude-sonnet-5-5
    enabled: true          # needs ANTHROPIC_API_KEY (+ prepaid credit)
    temperature: 0.7
    fallbacks:
      - anthropic/claude-haiku-5-5

  - name: Gemini
    model: gemini/gemini-3.5-flash
    enabled: true          # needs GEMINI_API_KEY (free tier available)
    temperature: 0.7
    fallbacks:             # tried in order if the primary is overloaded (503/429)
      - gemini/gemini-3-flash-preview
      - gemini/gemini-flash-lite-latest

  - name: Grok
    model: xai/grok-4.3
    enabled: false         # needs XAI_API_KEY (paid)
    temperature: 0.7

  # A local juhas — no API key, no per-call cost.
  # Install Ollama + `ollama pull llama3.1`, then flip enabled: true.
  - name: Llama-local
    model: ollama/llama3.1
    enabled: false
    temperature: 0.7

# The gazda presses the juhasi's answers into one final oscypek.
# Can be any model; start with whichever key you added first.
gazda:
  name: Gazda
  model: gemini/gemini-3.5-flash
  temperature: 0.4
  fallbacks:
    - gemini/gemini-3-flash-preview
    - gemini/gemini-flash-lite-latest
