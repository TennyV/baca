# Baca council config.
# Each member talks through LiteLLM. Cloud API keys come from the environment:
#   OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY, XAI_API_KEY
# Flip enabled: false for any model whose key you haven't added yet.
# Add a local model any time by pointing at ollama/<name> with no key needed.

system: "You are a sharp, concise expert. Be accurate and specific; do not pad."

council:
  - name: GPT
    model: openai/gpt-5.1
    enabled: true        # OPENAI_API_KEY added
    temperature: 0.7
    fallbacks:
      - openai/gpt-4.1

  - name: Claude
    model: anthropic/claude-sonnet-5-5
    enabled: true        # ANTHROPIC_API_KEY added
    temperature: 0.7
    fallbacks:
      - anthropic/claude-haiku-5-5

  - name: Gemini
    model: gemini/gemini-3.5-flash
    enabled: true        # set true once GEMINI_API_KEY is added (free tier available)
    temperature: 0.7
    fallbacks:           # tried in order if the primary is overloaded (503/429)
      - gemini/gemini-3-flash-preview
      - gemini/gemini-flash-lite-latest

  - name: Grok
    model: xai/grok-2-latest
    enabled: false        # set true once XAI_API_KEY is added
    temperature: 0.7

  # Local / open-weight example — no API key, no per-call cost.
  # Install Ollama + `ollama pull llama3.1`, then flip enabled: true.
  - name: Llama-local
    model: ollama/llama3.1
    enabled: false
    temperature: 0.7

# The chairman synthesizes the panel's answers into one final answer.
# Can be any member above (by its model string). Start with whichever key you add first.
chairman:
  name: Chairman
  model: gemini/gemini-3.5-flash
  temperature: 0.4
  fallbacks:
    - gemini/gemini-3-flash-preview
    - gemini/gemini-flash-lite-latest
